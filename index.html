<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrenador de Ecuaciones · 4º ESO</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2333;--mu:#667;--ac:#3b5bdb;--ok:#2b8a3e;--ko:#c92a2a;--bd:#d9deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151822;--card:#1f2433;--tx:#e8eaf2;--mu:#9aa3b8;--ac:#7c93ff;--ok:#51cf66;--ko:#ff6b6b;--bd:#343b52}}
:root[data-theme="dark"]{--bg:#151822;--card:#1f2433;--tx:#e8eaf2;--mu:#9aa3b8;--ac:#7c93ff;--ok:#51cf66;--ko:#ff6b6b;--bd:#343b52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0}.sub{color:var(--mu);margin:2px 0 16px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--ac)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.9rem;color:var(--mu)}
.eq{font-size:1.5rem;text-align:center;padding:22px 6px;overflow-x:auto;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 5px;font-size:1.15rem}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 5px 2px}.fr span:last-child{padding-top:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:center;font-size:1.3rem;flex-wrap:wrap}
input{font-size:1.2rem;width:150px;padding:8px 10px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input:disabled{opacity:.8}input.ko{border-color:var(--ko)}input.ok{border-color:var(--ok)}
button{font-size:1rem;padding:10px 18px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;font-weight:600}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.95rem}
.msg.ok{background:rgba(43,138,62,.15);color:var(--ok)}.msg.ko{background:rgba(201,42,42,.12)}
.msg.ko b.t{color:var(--ko)}.steps{margin:8px 0 0;padding-left:20px;color:var(--tx)}.steps li{margin:4px 0}
.act{text-align:center;margin-top:14px}
.grade{font-size:3rem;font-weight:800;text-align:center;color:var(--ac)}
.rec{border-left:4px solid var(--ac);padding:6px 12px;margin:10px 0;background:var(--bg);border-radius:0 8px 8px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
</style></head><body><main id="app"></main>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,nz=(a,b)=>{let v;do v=R(a,b);while(!v);return v},pk=a=>a[R(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b;
const M=n=>n<0?'−'+(-n):''+n,par=n=>n<0?'('+M(n)+')':''+n,sgn=n=>n<0?'− '+(-n):'+ '+n,xp=e=>'(x '+sgn(e)+')';
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function J(ts){ts=ts.filter(t=>t[0]!==0);if(!ts.length)return'0';let o='';
 ts.forEach((t,i)=>{const c=t[0],b=t[1],n=Math.abs(c);const s=((b!==''&&n===1)?'':n)+b;o+=i?(c<0?' − ':' + ')+s:(c<0?'−':'')+s});return o}
const fin=(n,d,x)=>`Dividimos entre ${par(d)}: x = ${M(n)} ÷ ${par(d)} = <b>${M(x)}</b>`;
function g1(){const a=nz(2,9)*pk([1,1,-1]),x=nz(-9,9),b=nz(-12,12),c=a*x+b;
 return{tag:'lineal',l:J([[a,'x'],[b,'']]),r:M(c),x,steps:[`Pasamos ${M(b)} al otro lado (cambia de signo): ${M(a)}x = ${M(c)} ${sgn(-b)} = ${M(c-b)}`,fin(c-b,a,x)]}}
function g2(){for(;;){const a=nz(-7,7),c=nz(-7,7),x=nz(-8,8),b=nz(-10,10),d=(a-c)*x+b;if(a===c||!d)continue;
 return{tag:'ambos',l:J([[a,'x'],[b,'']]),r:J([[c,'x'],[d,'']]),x,steps:[`Pasamos las x a un lado y los números al otro (cambian de signo): (${M(a)} − ${par(c)})x = ${M(d)} − ${par(b)}`,`${J([[a-c,'x']])} = ${M(d-b)}`,fin(d-b,a-c,x)]}}}
function g3(){for(;;){const a=R(2,6),c=R(2,6),x=nz(-6,6),b=nz(-6,6),e=nz(-6,6);if(a===c)continue;const k=a*(x+b)-c*(x+e);
 return{tag:'parentesis',l:J([[a,xp(b)],[-c,xp(e)]]),r:M(k),x,steps:[`Quitamos paréntesis (multiplicamos cada término, cuidado con el signo): ${J([[a,'x'],[a*b,''],[-c,'x'],[-c*e,'']])} = ${M(k)}`,`Agrupamos términos semejantes: ${J([[a-c,'x'],[a*b-c*e,'']])} = ${M(k)}`,`Pasamos el número al otro lado: ${J([[a-c,'x']])} = ${M(k-(a*b-c*e))}`,fin(k-(a*b-c*e),a-c,x)]}}}
function g3b(){for(;;){const a=R(2,7),c=R(2,7),x=nz(-6,6),b=nz(-6,6),e=nz(-6,6);const k=a*(x+b)-c*(x+e);if(a===c||!k)continue;
 return{tag:'parentesis',l:J([[a,xp(b)]]),r:J([[c,xp(e)],[k,'']]),x,steps:[`Quitamos paréntesis en los dos lados: ${J([[a,'x'],[a*b,'']])} = ${J([[c,'x'],[c*e+k,'']])}`,`Pasamos las x a un lado y los números al otro: ${J([[a-c,'x']])} = ${M(c*e+k-a*b)}`,fin(c*e+k-a*b,a-c,x)]}}}
function g4a(){for(;;){const a=R(2,5),c=R(2,5),s=nz(-5,5),x=a*s,m=R(-3,4),b=c*m-x;if(a===c||!b)continue;const d=s+m,L=lcm(a,c),S=L/a+L/c,rh=L*d-L/c*b;
 return{tag:'denom',l:J([[1,fr('x',a)],[1,fr('x '+sgn(b),c)]]),r:M(d),x,steps:[`Multiplicamos todo por el m.c.m.(${a}, ${c}) = ${L} para quitar denominadores: ${J([[L/a,'x'],[L/c,xp(b)]])} = ${M(L*d)}`,`Quitamos el paréntesis: ${J([[S,'x'],[L/c*b,'']])} = ${M(L*d)}`,`Pasamos el número al otro lado: ${J([[S,'x']])} = ${M(rh)}`,fin(rh,S,x)]}}}
function g4b(){for(;;){const b=R(2,6),d=R(2,6),x=nz(-6,6),m=R(-3,4),a=b*m-x,c=d*m-x;if(b===d||!a||!c)continue;
 return{tag:'denom',l:fr('x '+sgn(a),b),r:fr('x '+sgn(c),d),x,steps:[`Multiplicamos en cruz: ${J([[d,xp(a)]])} = ${J([[b,xp(c)]])}`,`Quitamos paréntesis: ${J([[d,'x'],[d*a,'']])} = ${J([[b,'x'],[b*c,'']])}`,`Pasamos las x a un lado y los números al otro: ${J([[d-b,'x']])} = ${M(b*c-d*a)}`,fin(b*c-d*a,d-b,x)]}}}
function g5a(){for(;;){const b=R(2,5),d=R(2,5),p=R(2,4),x=nz(-5,5),m=R(-3,3),n=R(-3,3),a=b*m-x,c=d*n-x;if(b===d||!a||!c)continue;
 const e=p*m-n,L=lcm(b,d),A=L/b*p,B=L/d;if(A===B)continue;const K=A*a-B*c,rh=L*e-K;
 return{tag:'mixta',l:J([[1,fr(p+'(x '+sgn(a)+')',b)],[-1,fr('x '+sgn(c),d)]]),r:M(e),x,steps:[`Multiplicamos todo por el m.c.m.(${b}, ${d}) = ${L}: ${J([[A,xp(a)],[-B,xp(c)]])} = ${M(L*e)}`,`Quitamos paréntesis y agrupamos: ${J([[A-B,'x'],[K,'']])} = ${M(L*e)}`,`Pasamos el número al otro lado: ${J([[A-B,'x']])} = ${M(rh)}`,fin(rh,A-B,x)]}}}
function g5b(){for(;;){const b=R(2,5),d=R(2,5),x=nz(-5,5),m=R(-3,3),n=R(-3,3),a=b*m-x,e=d*n-x,k=nz(2,4)*pk([1,-1]),c=nz(-6,6);if(b===d||!a||!e)continue;
 const r=m+k*(x+c)-n,L=lcm(b,d),P=L/b,Q=L/d;if(!r||P+L*k-Q===0)continue;const co=P+L*k-Q,rh=Q*e+L*r-(P*a+L*k*c);
 return{tag:'mixta',l:J([[1,fr('x '+sgn(a),b)],[k,xp(c)]]),r:J([[1,fr('x '+sgn(e),d)],[r,'']]),x,steps:[`Multiplicamos todo por el m.c.m.(${b}, ${d}) = ${L}: ${J([[P,xp(a)],[L*k,xp(c)]])} = ${J([[Q,xp(e)],[L*r,'']])}`,`Quitamos paréntesis: ${J([[P+L*k,'x'],[P*a+L*k*c,'']])} = ${J([[Q,'x'],[Q*e+L*r,'']])}`,`Pasamos las x a un lado y los números al otro: ${J([[co,'x']])} = ${M(rh)}`,fin(rh,co,x)]}}}
const PER=3,LV=[{n:'Nivel 1 · Básicas',g:[g1]},{n:'Nivel 2 · Incógnita en los dos lados',g:[g2]},{n:'Nivel 3 · Paréntesis',g:[g3,g3b]},{n:'Nivel 4 · Denominadores',g:[g4a,g4b]},{n:'Nivel 5 · Paréntesis y fracciones combinados',g:[g5a,g5b]}];
const REC={lineal:['Ecuaciones básicas','Repasa el cambio de signo al pasar un término al otro lado y recuerda dividir entre el coeficiente de la x, incluso si es negativo.'],
ambos:['Incógnita en los dos lados','Junta todas las x en un miembro y los números en el otro. Al mover un término, cambia su signo; fíjate sobre todo cuando hay coeficientes negativos.'],
parentesis:['Paréntesis','Multiplica el número de fuera por todos los términos de dentro. Si delante del paréntesis hay un signo menos, cambia el signo de todo lo que hay dentro.'],
denom:['Denominadores','Calcula bien el m.c.m. de los denominadores y multiplica todos los términos (también los que no tienen fracción) por él. Si es una proporción, multiplica en cruz.'],
mixta:['Ecuaciones combinadas','Hazlo en orden: 1) quita denominadores multiplicando por el m.c.m.; 2) quita paréntesis; 3) agrupa términos semejantes; 4) despeja la x. No te saltes pasos.']};
let S,prev='';
function start(){S={v:'intro',lv:0,slot:0,att:0,eq:null,gen:null,locked:false,first:0,tot:0,pl:LV.map(()=>({ok:0,re:0})),errs:{}}}
function newEq(g){let e;do e=g();while(e.l+e.r===prev);prev=e.l+e.r;S.eq=e;S.gen=g;S.locked=false;S.val=''}
function nextSlot(){newEq(LV[S.lv].g[S.slot%LV[S.lv].g.length]);S.att=0;S.v='q'}
function parse(s){s=s.replace(/\s/g,'').replace(/−/g,'-').replace(',','.');let m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);if(m)return+m[1]/+m[2];return/^-?\d+(\.\d+)?$/.test(s)?+s:NaN}
function verify(){const raw=document.getElementById('ans').value,v=parse(raw);const hint=document.getElementById('hint');
 if(isNaN(v)||(raw.includes('/')&&parse(raw)===Infinity)){hint.textContent='Escribe un número (ej. 3, -2 o 5/2).';return}
 const ok=Math.abs(v-S.eq.x)<1e-6;S.val=raw;S.locked=true;S.ok=ok;
 if(S.att===0){S.tot++;if(ok){S.first++;S.pl[S.lv].ok++}}
 if(!ok){S.errs[S.eq.tag]=(S.errs[S.eq.tag]||0)+1;S.pl[S.lv].re++;S.att++}
 render()}
function next(){if(S.ok){S.slot++;if(S.slot>=PER){S.v=S.lv===LV.length-1?'end':'lvl';render();return}nextSlot()}else newEq(S.gen);render()}
function render(){const A=document.getElementById('app'),tot=LV.length*PER;let h=`<h1>Matemáticas 4º ESO</h1><p class="sub">Entrenador de ecuaciones · de básicas a complejas</p>`;
 if(S.v==='intro'){h+=`<div class="card"><p>Superarás <b>5 niveles</b> de dificultad creciente, con <b>${PER} ecuaciones</b> por nivel. Escribe el valor de x como número entero, decimal o fracción (por ejemplo <b>-3</b> o <b>5/2</b>).</p><p>Si fallas, verás tu error y la resolución paso a paso, pero <b>no podrás cambiar tu respuesta</b>: tendrás que resolver otra ecuación parecida para superar el nivel. Al final recibirás una nota y recomendaciones.</p><div class="act"><button onclick="nextSlot();render()">Empezar</button></div></div>`}
 else if(S.v==='q'){const e=S.eq,done=S.lv*PER+S.slot;
  h+=`<div class="card"><div class="meta"><b>${LV[S.lv].n}</b><span>Ecuación ${S.slot+1}/${PER}${S.att?' · parecida (intento '+(S.att+1)+')':''}</span></div><div class="bar"><i style="width:${done/tot*100}%"></i></div>
  <div class="eq">${e.l} = ${e.r}</div><div class="row">x = <input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" value="${S.locked?S.val.replace(/"/g,''):''}" ${S.locked?'disabled class="'+(S.ok?'ok':'ko')+'"':''}>${S.locked?'':'<button onclick="verify()">Verificar</button>'}</div><div id="hint" class="sub" style="text-align:center"></div>`;
  if(S.locked){if(S.ok)h+=`<div class="msg ok">✅ ¡Correcto! x = ${M(e.x)}</div>`;
   else h+=`<div class="msg ko"><b class="t">❌ Incorrecto.</b> Tu respuesta: <b>${S.val}</b> (no se puede modificar). Solución correcta: <b>x = ${M(e.x)}</b><ol class="steps">${e.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
   h+=`<div class="act"><button onclick="next()">${S.ok?(S.slot+1>=PER?'Terminar nivel →':'Siguiente ecuación →'):'Otra parecida →'}</button></div>`}
  h+='</div>'}
 else if(S.v==='lvl'){const p=S.pl[S.lv];h+=`<div class="card"><div class="grade">🎉</div><h2 style="text-align:center">¡${LV[S.lv].n.split(' · ')[0]} superado!</h2><p style="text-align:center">Acertadas a la primera: <b>${p.ok}/${PER}</b> · Fallos: <b>${p.re}</b></p><div class="act"><button onclick="S.lv++;S.slot=0;nextSlot();render()">Ir al ${LV[S.lv+1].n.split(' · ')[0].toLowerCase()} →</button></div></div>`}
 else{const g=S.first/S.tot*10,t=g>=9?'Sobresaliente':g>=7?'Notable':g>=6?'Bien':g>=5?'Suficiente':'Insuficiente',es=Object.entries(S.errs).sort((a,b)=>b[1]-a[1]);
  h+=`<div class="card"><p style="text-align:center;margin:0">Has superado los 5 niveles</p><div class="grade">${g.toFixed(1)}</div><p style="text-align:center;margin:0"><b>${t}</b> · ${S.first} de ${S.tot} ecuaciones acertadas a la primera</p></div>
  <div class="card"><h3 style="margin-top:0">Resumen por nivel</h3><table><tr><th>Nivel</th><th>A la primera</th><th>Fallos</th></tr>${LV.map((l,i)=>`<tr><td>${l.n}</td><td>${S.pl[i].ok}/${PER}</td><td>${S.pl[i].re}</td></tr>`).join('')}</table></div>
  <div class="card"><h3 style="margin-top:0">Recomendaciones</h3>${es.length?es.map(([k,n])=>`<div class="rec"><b>${REC[k][0]}</b> (${n} fallo${n>1?'s':''})<br>${REC[k][1]}</div>`).join(''):'<div class="rec">No has fallado ninguna ecuación. ¡Excelente trabajo! Prueba a repetir para practicar con ecuaciones nuevas.</div>'}<div class="act"><button onclick="start();render()">Volver a empezar</button></div></div>`}
 A.innerHTML=h;const i=document.getElementById('ans');if(i&&!S.locked){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')verify()})}}
start();render();
</script></body></html>
